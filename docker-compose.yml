services:
  app:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: payravel
      DB_USERNAME: payravel
      DB_PASSWORD: secret
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      MAIL_HOST: sandbox.smtp.mailtrap.io
      MAIL_PORT: 2525
      MAIL_FROM_ADDRESS: noreply@payravel.com
      MAIL_FROM_NAME: Payravel
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "php artisan key:generate --force &&
             php artisan migrate --force &&
             php artisan passport:keys --force &&
             php artisan passport:client --personal --no-interaction &&
             php artisan db:seed --force &&
             php artisan storage:link --force &&
             php artisan serve --host=0.0.0.0 --port=8000 --no-reload &
             until curl -sf http://localhost:8000/up > /dev/null 2>&1; do sleep 1; done &&
             for i in 1 2 3 4 5; do curl -s http://localhost:8000/up > /dev/null 2>&1; done &&
             echo 'Backend warmed up and ready' &&
             wait"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payravel
      POSTGRES_USER: payravel
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payravel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
