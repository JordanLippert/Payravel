services:
  - type: web
    name: payravel-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: APP_NAME
        value: Payravel
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generate with: php artisan key:generate --show
      - key: APP_KEY
        sync: false
      # Set after first deploy (the Render service public URL)
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      # --- Database (Neon PostgreSQL) — all values set in Render dashboard ---
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      # --- Cache / Session ---
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: array
      # --- Passport OAuth keys (base64-encoded PEM) ---
      # Run once in Render Shell after first deploy:
      #   php artisan passport:install --uuids
      # Then extract keys:
      #   base64 -w0 storage/oauth-private.key
      #   base64 -w0 storage/oauth-public.key
      # Set them here so tokens survive container restarts.
      - key: PASSPORT_PRIVATE_KEY
        sync: false
      - key: PASSPORT_PUBLIC_KEY
        sync: false
      # --- Mail (Mailtrap or similar) ---
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: noreply@payravel.com
      - key: MAIL_FROM_NAME
        value: Payravel

  - type: cron
    name: payravel-scheduler
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "* * * * *"
    command: php artisan schedule:run
    envVars:
      - fromService:
          name: payravel-backend
          type: web
          envVarKey: APP_KEY
      - fromService:
          name: payravel-backend
          type: web
          envVarKey: APP_ENV
      - fromService:
          name: payravel-backend
          type: web
          envVarKey: DB_CONNECTION
      - fromService:
          name: payravel-backend
          type: web
          envVarKey: DB_HOST
      - fromService:
          name: payravel-backend
          type: web
          envVarKey: DB_PORT
      - fromService:
          name: payravel-backend
          type: web
          envVarKey: DB_DATABASE
      - fromService:
          name: payravel-backend
          type: web
          envVarKey: DB_USERNAME
      - fromService:
          name: payravel-backend
          type: web
          envVarKey: DB_PASSWORD
      - fromService:
          name: payravel-backend
          type: web
          envVarKey: DB_SSLMODE
      - fromService:
          name: payravel-backend
          type: web
          envVarKey: CACHE_STORE
